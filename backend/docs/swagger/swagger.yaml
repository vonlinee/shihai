basePath: /
consumes:
- application/json
definitions:
  dto.AdminCreateUserRequest:
    properties:
      name:
        description: 显示名称，可选
        maxLength: 50
        type: string
      password:
        description: 密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      roleIds:
        description: 角色ID列表，为空则分配默认 user 角色
        items:
          type: integer
        type: array
      username:
        description: 用户名，3-50字符
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.AssignPermissionRequest:
    properties:
      permissions:
        description: 权限编码列表，如 ["user:create", "poem:read"]
        items:
          type: string
        type: array
    required:
    - permissions
    type: object
  dto.AssignRoleRequest:
    properties:
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
    required:
    - roleIds
    type: object
  dto.BatchDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  dto.ChangePasswordRequest:
    properties:
      newPassword:
        description: 新密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      oldPassword:
        description: 当前密码
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.CheckPermissionRequest:
    properties:
      permission:
        description: 权限编码，如 "user:create"
        type: string
    required:
    - permission
    type: object
  dto.CiTuneCreateRequest:
    properties:
      aliases:
        description: Aliases 词牌别名，用于标题解析。
        items:
          type: string
        type: array
      description:
        description: Description 词牌说明。
        type: string
      name:
        description: Name 词牌名，例如水调歌头、念奴娇。
        maxLength: 100
        type: string
      poemTypeId:
        description: PoemTypeID 所属词体裁 ID；0 表示未归类。
        type: integer
    required:
    - name
    type: object
  dto.CiTuneTitleParseRequest:
    properties:
      title:
        description: Title 诗词标题，通常以词牌名开头。
        maxLength: 200
        type: string
    required:
    - title
    type: object
  dto.CiTuneUpdateRequest:
    properties:
      aliases:
        description: Aliases 词牌别名，用于标题解析。
        items:
          type: string
        type: array
      description:
        description: Description 词牌说明。
        type: string
      name:
        description: Name 词牌名，例如水调歌头、念奴娇。
        maxLength: 100
        type: string
      poemTypeId:
        description: PoemTypeID 所属词体裁 ID；0 表示未归类。
        type: integer
    required:
    - name
    type: object
  dto.CommentCreateRequest:
    properties:
      content:
        description: 评论正文内容，必填
        type: string
      parentId:
        description: 父评论ID，回复评论时传入，顶级评论不传
        type: integer
      poemId:
        description: 评论所属诗词ID，必填
        type: integer
      visitorId:
        description: 游客唯一标识，未登录用户使用
        maxLength: 64
        type: string
      visitorName:
        description: 游客显示名称
        maxLength: 50
        type: string
    required:
    - content
    - poemId
    type: object
  dto.CommentVoteRequest:
    properties:
      commentId:
        description: 被投票的评论ID
        type: integer
      type:
        description: 投票类型：like 或 dislike
        enum:
        - like
        - dislike
        type: string
    required:
    - commentId
    - type
    type: object
  dto.CorrectionCreateRequest:
    properties:
      originalText:
        description: OriginalText 当前错误或待确认的原文。
        type: string
      poemId:
        description: PoemID 被纠错诗词的 Snowflake ID。
        type: integer
      reason:
        description: Reason 纠错原因、依据和补充说明。
        type: string
      suggestedText:
        description: SuggestedText 用户建议修改后的内容。
        type: string
      type:
        description: Type 纠错位置或类型，例如 title、author、dynasty、content、translation、appreciation、annotation
          或 other。
        maxLength: 20
        type: string
    required:
    - originalText
    - poemId
    - reason
    - suggestedText
    - type
    type: object
  dto.CorrectionPoemSummary:
    properties:
      id:
        description: ID 诗词 Snowflake ID，对外序列化为字符串。
        example: "0"
        type: string
      title:
        description: Title 诗词标题。
        type: string
    type: object
  dto.CorrectionResponse:
    properties:
      approveCount:
        description: ApproveCount 支持票数。
        type: integer
      createdAt:
        description: CreatedAt 创建时间。
        type: string
      id:
        description: ID 纠错申请 Snowflake ID，对外序列化为字符串。
        example: "0"
        type: string
      originalText:
        description: OriginalText 被纠错的原文内容。
        type: string
      poem:
        allOf:
        - $ref: '#/definitions/dto.CorrectionPoemSummary'
        description: Poem 被纠错诗词摘要。
      poemId:
        description: PoemID 被纠错诗词的 Snowflake ID。
        example: "0"
        type: string
      reason:
        description: Reason 用户提交的纠错理由。
        type: string
      rejectCount:
        description: RejectCount 反对票数。
        type: integer
      status:
        description: Status 当前状态：pending、voting、processing、approved、rejected、resolved
          或 completed。
        type: string
      suggestedText:
        description: SuggestedText 用户建议修改后的内容。
        type: string
      type:
        description: Type 纠错类型。
        type: string
      updatedAt:
        description: UpdatedAt 更新时间。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/dto.CorrectionUserSummary'
        description: User 提交用户摘要。
      userId:
        description: UserID 提交用户的 Snowflake ID。
        example: "0"
        type: string
      voteCount:
        description: VoteCount 投票总数。
        type: integer
    type: object
  dto.CorrectionStatusUpdateRequest:
    properties:
      status:
        description: Status 目标状态。
        enum:
        - pending
        - voting
        - processing
        - approved
        - rejected
        - resolved
        - completed
        type: string
    required:
    - status
    type: object
  dto.CorrectionUserSummary:
    properties:
      avatar:
        description: Avatar 用户头像地址。
        type: string
      id:
        description: ID 用户 Snowflake ID，对外序列化为字符串。
        example: "0"
        type: string
      name:
        description: Name 用户显示名称。
        type: string
      username:
        description: Username 用户名。
        type: string
    type: object
  dto.DashboardActivityResponse:
    properties:
      action:
        description: Action display label.
        type: string
      createdAt:
        description: CreatedAt activity creation timestamp.
        type: string
      detail:
        description: Detail human-readable activity summary.
        type: string
      id:
        description: ID stable identifier built from activity type and entity ID.
        type: string
    type: object
  dto.DashboardResponse:
    properties:
      recentActivities:
        description: RecentActivities latest cross-module activity stream.
        items:
          $ref: '#/definitions/dto.DashboardActivityResponse'
        type: array
      stats:
        description: Stats dashboard summary cards.
        items:
          $ref: '#/definitions/dto.DashboardStatResponse'
        type: array
    type: object
  dto.DashboardStatResponse:
    properties:
      key:
        description: Key stable frontend identifier for the statistic.
        type: string
      title:
        description: Title display label for the statistic.
        type: string
      trendPercent:
        description: TrendPercent percentage change for the latest 7 days versus the
          previous 7 days.
        type: integer
      value:
        description: Value current total count.
        type: integer
    type: object
  dto.DynastyCreateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        type: string
      period:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.DynastyUpdateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        type: string
      period:
        maxLength: 100
        type: string
    type: object
  dto.ForumPostCreateRequest:
    properties:
      content:
        description: Content 帖子正文，最多 10000 个字符。
        maxLength: 10000
        minLength: 2
        type: string
      title:
        description: Title 帖子标题，2-200 个字符。
        maxLength: 200
        minLength: 2
        type: string
    required:
    - content
    - title
    type: object
  dto.ForumPostPinRequest:
    properties:
      isPinned:
        description: IsPinned 是否置顶，置顶帖列表优先展示。
        type: boolean
    type: object
  dto.ForumPostUpdateRequest:
    properties:
      content:
        description: Content 帖子正文；为空时不更新。
        maxLength: 10000
        minLength: 2
        type: string
      title:
        description: Title 帖子标题；为空时不更新。
        maxLength: 200
        minLength: 2
        type: string
    type: object
  dto.ForumReplyCreateRequest:
    properties:
      content:
        description: Content 回复正文，最多 5000 个字符。
        maxLength: 5000
        minLength: 1
        type: string
      parentId:
        description: ParentID 父回复 Snowflake ID，楼中楼回复时传入。
        type: integer
    required:
    - content
    type: object
  dto.LoginRequest:
    properties:
      password:
        description: 密码
        type: string
      username:
        description: 用户名
        type: string
    required:
    - password
    - username
    type: object
  dto.PermissionCreateRequest:
    properties:
      code:
        description: 权限编码，必填，格式 "模块:操作"
        maxLength: 100
        type: string
      description:
        description: 权限描述
        maxLength: 255
        type: string
      module:
        description: 所属模块，必填，如 user、poem
        maxLength: 50
        type: string
      name:
        description: 权限名称，必填，中文显示名
        maxLength: 100
        type: string
    required:
    - code
    - module
    - name
    type: object
  dto.PermissionUpdateRequest:
    properties:
      description:
        description: 权限描述
        maxLength: 255
        type: string
      isActive:
        description: 是否启用，指针类型以区分未提供和 false
        type: boolean
      module:
        description: 所属模块
        maxLength: 50
        type: string
      name:
        description: 权限名称
        maxLength: 100
        type: string
    type: object
  dto.PingzeRecognitionRequest:
    properties:
      texts:
        description: Texts 待识别文本列表，响应保持相同顺序。
        items:
          type: string
        type: array
    required:
    - texts
    type: object
  dto.PoemAnnotationCreateRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemAnnotationUpdateRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemAnnotationUpsertRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      id:
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemCreateRequest:
    properties:
      annotation:
        type: string
      annotations:
        items:
          $ref: '#/definitions/dto.PoemAnnotationUpsertRequest'
        type: array
      appreciation:
        type: string
      audioUrl:
        maxLength: 500
        type: string
      authorId:
        type: integer
      authorName:
        type: string
      ciTuneId:
        description: CiTuneID 词牌 ID，仅当体裁一级分类为词时使用；未提供时可由标题解析。
        type: integer
      content:
        items:
          type: string
        type: array
      coverImage:
        maxLength: 500
        type: string
      dynastyId:
        type: integer
      dynastyName:
        type: string
      genre:
        maxLength: 50
        type: string
      genreCategory:
        description: GenreCategory 体裁一级分类，例如诗、词、曲、文。
        maxLength: 50
        type: string
      pingze:
        description: Pingze 与 Content 每个文本元素对应的平仄标记，只允许平/仄/?。
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
      translation:
        type: string
    required:
    - content
    - title
    type: object
  dto.PoemTypeCreateRequest:
    properties:
      category:
        description: Category 一级分类，例如诗、词、曲、文。
        maxLength: 50
        type: string
      charsPerLine:
        description: CharsPerLine 常见每句字数；nil 表示不限定。
        type: integer
      description:
        description: Description 体裁说明。
        type: string
      lines:
        description: Lines 常见句数；nil 表示不限定。
        type: integer
      name:
        description: Name 细分类别名称，也是诗词保存到 genre 字段的值。
        maxLength: 50
        type: string
    required:
    - category
    - name
    type: object
  dto.PoemTypeUpdateRequest:
    properties:
      category:
        description: Category 一级分类，例如诗、词、曲、文。
        maxLength: 50
        type: string
      charsPerLine:
        description: CharsPerLine 常见每句字数；nil 表示不限定。
        type: integer
      description:
        description: Description 体裁说明。
        type: string
      lines:
        description: Lines 常见句数；nil 表示不限定。
        type: integer
      name:
        description: Name 细分类别名称，也是诗词保存到 genre 字段的值。
        maxLength: 50
        type: string
    required:
    - category
    - name
    type: object
  dto.PoemUpdateRequest:
    properties:
      annotation:
        type: string
      annotations:
        items:
          $ref: '#/definitions/dto.PoemAnnotationUpsertRequest'
        type: array
      appreciation:
        type: string
      audioUrl:
        maxLength: 500
        type: string
      authorId:
        type: integer
      ciTuneId:
        description: CiTuneID 词牌 ID，nil 表示不主动覆盖，0 表示清空。
        type: integer
      content:
        items:
          type: string
        type: array
      coverImage:
        maxLength: 500
        type: string
      dynastyId:
        type: integer
      genre:
        maxLength: 50
        type: string
      genreCategory:
        description: GenreCategory 体裁一级分类，例如诗、词、曲、文。
        maxLength: 50
        type: string
      pingze:
        description: Pingze 与 Content 每个文本元素对应的平仄标记，只允许平/仄/?；nil 表示本次不主动覆盖。
        items:
          type: string
        type: array
      title:
        maxLength: 200
        type: string
      translation:
        type: string
    type: object
  dto.PoetCreateRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      biography:
        type: string
      birthYear:
        type: integer
      deathYear:
        type: integer
      dynastyId:
        type: integer
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  dto.PoetUpdateRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      biography:
        type: string
      birthYear:
        type: integer
      deathYear:
        type: integer
      dynastyId:
        type: integer
      name:
        maxLength: 50
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      name:
        description: 显示名称，可选，最多50字符
        maxLength: 50
        type: string
      password:
        description: 密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      username:
        description: 用户名，3-50字符
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.RoleCreateRequest:
    properties:
      description:
        description: 角色功能描述
        maxLength: 255
        type: string
      name:
        description: 角色名称，必填，如 admin、editor
        maxLength: 50
        type: string
    required:
    - name
    type: object
  dto.RoleUpdateRequest:
    properties:
      description:
        description: 角色描述
        maxLength: 255
        type: string
      isActive:
        description: 是否启用，指针类型以区分未提供和 false
        type: boolean
      name:
        description: 角色名称
        maxLength: 50
        type: string
    type: object
  dto.TextConversionRequest:
    properties:
      mode:
        description: Mode 转换模式，例如 s2t、t2s。
        type: string
      texts:
        description: Texts 待转换文本列表，响应会保持相同顺序。
        items:
          type: string
        type: array
    required:
    - mode
    - texts
    type: object
  dto.UpdateUserRequest:
    properties:
      age:
        description: 年龄
        type: integer
      avatar:
        description: 头像URL
        maxLength: 255
        type: string
      gender:
        description: 性别：male/female/other
        maxLength: 10
        type: string
      name:
        description: 显示名称
        maxLength: 50
        type: string
      phone:
        description: 手机号码
        maxLength: 20
        type: string
    type: object
  dto.WorkCollectionCreateRequest:
    properties:
      coverImage:
        type: string
      description:
        type: string
      isPublished:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  dto.WorkCollectionItemCreateRequest:
    properties:
      sortOrder:
        type: integer
      workId:
        type: integer
      workType:
        type: string
    required:
    - workId
    - workType
    type: object
  dto.WorkCollectionItemUpdateRequest:
    properties:
      sortOrder:
        type: integer
    type: object
  dto.WorkCollectionUpdateRequest:
    properties:
      coverImage:
        type: string
      description:
        type: string
      isPublished:
        type: boolean
      title:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: 识海诗词平台后端 API 文档。
  title: 识海 API
  version: "1.0"
paths:
  /api/admin/announcements:
    post:
      parameters:
      - description: 公告信息
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 创建公告
      tags:
      - 后台公告
  /api/admin/announcements/{id}:
    delete:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 删除公告
      tags:
      - 后台公告
    put:
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      - description: 公告信息
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
      summary: 更新公告
      tags:
      - 后台公告
  /api/admin/ci-tunes:
    delete:
      parameters:
      - description: 词牌 ID 列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BatchDeleteRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - BearerAuth: []
