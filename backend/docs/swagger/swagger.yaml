basePath: /
consumes:
- application/json
definitions:
  dto.AdminCreateUserRequest:
    properties:
      name:
        description: 显示名称，可选
        maxLength: 50
        type: string
      password:
        description: 密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      roleIds:
        description: 角色ID列表，为空则分配默认 user 角色
        items:
          type: integer
        type: array
      username:
        description: 用户名，3-50字符
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.AssignPermissionRequest:
    properties:
      permissions:
        description: 权限编码列表，如 ["user:create", "poem:read"]
        items:
          type: string
        type: array
    required:
    - permissions
    type: object
  dto.AssignRoleRequest:
    properties:
      roleIds:
        description: 角色ID列表
        items:
          type: integer
        type: array
    required:
    - roleIds
    type: object
  dto.BatchDeleteRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  dto.ChangePasswordRequest:
    properties:
      newPassword:
        description: 新密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      oldPassword:
        description: 当前密码
        type: string
    required:
    - newPassword
    - oldPassword
    type: object
  dto.CheckPermissionRequest:
    properties:
      permission:
        description: 权限编码，如 "user:create"
        type: string
    required:
    - permission
    type: object
  dto.CommentCreateRequest:
    properties:
      content:
        description: 评论正文内容，必填
        type: string
      parentId:
        description: 父评论ID，回复评论时传入，顶级评论不传
        type: integer
      poemId:
        description: 评论所属诗词ID，必填
        type: integer
      visitorId:
        description: 游客唯一标识，未登录用户使用
        maxLength: 64
        type: string
      visitorName:
        description: 游客显示名称
        maxLength: 50
        type: string
    required:
    - content
    - poemId
    type: object
  dto.CommentVoteRequest:
    properties:
      commentId:
        description: 被投票的评论ID
        type: integer
      type:
        description: 投票类型：like 或 dislike
        enum:
        - like
        - dislike
        type: string
    required:
    - commentId
    - type
    type: object
  dto.DynastyCreateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        type: string
      period:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  dto.DynastyUpdateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 50
        type: string
      period:
        maxLength: 100
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        description: 密码
        type: string
      username:
        description: 用户名
        type: string
    required:
    - password
    - username
    type: object
  dto.PermissionCreateRequest:
    properties:
      code:
        description: 权限编码，必填，格式 "模块:操作"
        maxLength: 100
        type: string
      description:
        description: 权限描述
        maxLength: 255
        type: string
      module:
        description: 所属模块，必填，如 user、poem
        maxLength: 50
        type: string
      name:
        description: 权限名称，必填，中文显示名
        maxLength: 100
        type: string
    required:
    - code
    - module
    - name
    type: object
  dto.PermissionUpdateRequest:
    properties:
      description:
        description: 权限描述
        maxLength: 255
        type: string
      isActive:
        description: 是否启用，指针类型以区分未提供和 false
        type: boolean
      module:
        description: 所属模块
        maxLength: 50
        type: string
      name:
        description: 权限名称
        maxLength: 100
        type: string
    type: object
  dto.PoemAnnotationCreateRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemAnnotationUpdateRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemAnnotationUpsertRequest:
    properties:
      content:
        type: string
      displayOrder:
        type: integer
      endLine:
        minimum: 0
        type: integer
      endOffset:
        minimum: 0
        type: integer
      id:
        type: integer
      selectedText:
        type: string
      startLine:
        minimum: 0
        type: integer
      startOffset:
        minimum: 0
        type: integer
      targetField:
        type: string
      title:
        maxLength: 100
        type: string
      type:
        type: string
    required:
    - content
    - selectedText
    type: object
  dto.PoemCreateRequest:
    properties:
      annotation:
        type: string
      annotations:
        items:
          $ref: '#/definitions/dto.PoemAnnotationUpsertRequest'
        type: array
      appreciation:
        type: string
      audioUrl:
        maxLength: 500
        type: string
      authorId:
        type: integer
      authorName:
        type: string
      content:
        items:
          type: string
        type: array
      coverImage:
        maxLength: 500
        type: string
      dynastyId:
        type: integer
      dynastyName:
        type: string
      genre:
        maxLength: 50
        type: string
      title:
        maxLength: 200
        type: string
      translation:
        type: string
    required:
    - content
    - title
    type: object
  dto.PoemUpdateRequest:
    properties:
      annotation:
        type: string
      annotations:
        items:
          $ref: '#/definitions/dto.PoemAnnotationUpsertRequest'
        type: array
      appreciation:
        type: string
      audioUrl:
        maxLength: 500
        type: string
      authorId:
        type: integer
      content:
        items:
          type: string
        type: array
      coverImage:
        maxLength: 500
        type: string
      dynastyId:
        type: integer
      genre:
        maxLength: 50
        type: string
      title:
        maxLength: 200
        type: string
      translation:
        type: string
    type: object
  dto.PoetCreateRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      biography:
        type: string
      birthYear:
        type: integer
      deathYear:
        type: integer
      dynastyId:
        type: integer
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  dto.PoetUpdateRequest:
    properties:
      avatar:
        maxLength: 255
        type: string
      biography:
        type: string
      birthYear:
        type: integer
      deathYear:
        type: integer
      dynastyId:
        type: integer
      name:
        maxLength: 50
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      name:
        description: 显示名称，可选，最多50字符
        maxLength: 50
        type: string
      password:
        description: 密码，6-100字符
        maxLength: 100
        minLength: 6
        type: string
      username:
        description: 用户名，3-50字符
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.RoleCreateRequest:
    properties:
      description:
        description: 角色功能描述
        maxLength: 255
        type: string
      name:
        description: 角色名称，必填，如 admin、editor
        maxLength: 50
        type: string
    required:
    - name
    type: object
  dto.RoleUpdateRequest:
    properties:
      description:
        description: 角色描述
        maxLength: 255
        type: string
      isActive:
        description: 是否启用，指针类型以区分未提供和 false
        type: boolean
      name:
        description: 角色名称
        maxLength: 50
        type: string
    type: object
  dto.TextConversionRequest:
    properties:
      mode:
        description: Mode 转换模式，例如 s2t、t2s。
        type: string
      texts:
        description: Texts 待转换文本列表，响应会保持相同顺序。
        items:
          type: string
        type: array
    required:
    - mode
    - texts
    type: object
  dto.UpdateUserRequest:
    properties:
      age:
        description: 年龄
        type: integer
      avatar:
        description: 头像URL
        maxLength: 255
        type: string
      gender:
        description: 性别：male/female/other
        maxLength: 10
        type: string
      name:
        description: 显示名称
        maxLength: 50
        type: string
      phone:
        description: 手机号码
        maxLength: 20
        type: string
    type: object
  dto.WorkCollectionCreateRequest:
    properties:
      coverImage:
        type: string
      description:
        type: string
      isPublished:
        type: boolean
      title:
        type: string
    required:
    - title
    type: object
  dto.WorkCollectionItemCreateRequest:
    properties:
      sortOrder:
        type: integer
      workId:
        type: integer
      workType:
        type: string
    required:
    - workId
    - workType
    type: object
  dto.WorkCollectionItemUpdateRequest:
    properties:
      sortOrder:
        type: integer
    type: object
  dto.WorkCollectionUpdateRequest:
    properties:
      coverImage:
        type: string
      description:
        type: string
      isPublished:
        type: boolean
      title:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
info:
  contact: {}
  description: 识海诗词平台后端 API 文档。
  title: 识海 API
  version: "1.0"
paths:
  /api/admin/announcements:
    post:
      parameters:
      - description: 公告信息
        in: body
        name: request
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
